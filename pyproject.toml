[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threatatlas"
version = "0.1.0"
description = "LLM security evaluation lab for adversarial prompt testing"
authors = [{ name = "Evin Smith" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
threatatlas-eval = "evals.cli:main"