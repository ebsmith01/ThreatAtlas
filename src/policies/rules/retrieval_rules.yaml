rules:
  - rule_id: confidential_retrieval_exposure
    description:
      Confidential retrieval exposed
    severity: critical
    vulnerability:
      cross_context_data_exfiltration
    conditions:
      retrieved_sensitivity: confidential
  - rule_id: retrieval_permission_violation
    description:
      Unauthorized retrieval
    severity: high
    vulnerability:
      retrieval_augmented_privilege_escalation
    conditions:
      retrieval_allowed: false
