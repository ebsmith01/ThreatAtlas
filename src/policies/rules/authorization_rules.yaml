rules:
  - rule_id: unauthorized_tool_execution
    description:
      Tool executed without authorization
    severity: critical
    vulnerability:
      agent_tool_permission_bypass
    conditions:
      is_authorized: false
      tool_execution_success: true
  - rule_id: role_escalation_attempt
    description:
      Unauthorized privilege escalation
    severity: high
    vulnerability:
      privilege_escalation
    conditions:
      actor_role: user
      required_permission: admin
