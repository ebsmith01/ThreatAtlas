- id: unsafe_behavioral_response

  category: behavioral

  severity: high

  action: warn

  description: >
    The model produced behavior inconsistent
    with expected security alignment.

  conditions:

    blocked: false


- id: confidential_data_disclosure

  category: behavioral

  severity: critical

  action: deny

  description: >
    The system exposed confidential information
    during runtime execution.

  conditions:

    sensitivity: confidential


- id: unsafe_tool_orchestration

  category: behavioral

  severity: critical

  action: deny

  description: >
    Agent workflow demonstrated unsafe
    tool execution behavior.

  conditions:

    allowed: true

    actor_role: user


- id: policy_alignment_failure

  category: behavioral

  severity: high

  action: warn

  description: >
    Model behavior diverged from expected
    security policy constraints.

  conditions:

    is_authorized: false